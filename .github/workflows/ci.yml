name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check (format, lint, types)
        run: npm run check

      # The 100% coverage gate: fails on any threshold shortfall.
      - name: Test with coverage
        run: npx vitest run --coverage.enabled

      # Typecheck cannot catch a peer-only runtime dependency: the dev tree
      # always resolves it. This packs the real tarball, installs it clean,
      # and imports both entrypoints under Bun (the TUI loader's runtime).
      - name: Runtime host-compat probe
        run: node ../scripts/host-compat.mjs .
