name: SDK canary

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Probe latest @opencode/plugin
        id: probe
        run: |
          set -e
          VER=$(npm view @opencode/plugin dist-tags.latest)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Testing against @opencode/plugin@$VER"
          mkdir -p /tmp/canary && cd /tmp/canary
          npm init -y > /dev/null
          npm install --no-save --legacy-peer-deps "@opencode/plugin@$VER" solid-js@1.9.15 zod@^4 "opencode-usage-quota-tracker@alpha"
          bun -e "import('opencode-usage-quota-tracker').then(m => { if (typeof m.default?.setup !== 'function') throw new Error('default export has no setup()') })"
          echo "canary green"

      - name: Open pin-bump PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ steps.probe.outputs.version }}
        run: |
          git config user.name "sdk-canary-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "canary/sdk-bump-$SDK_VERSION"
          python3 scripts/bump-pin.py
          git commit -am "chore: bump @opencode/plugin pin to $SDK_VERSION (canary green)"
          git push -u origin "canary/sdk-bump-$SDK_VERSION" --force 2>\&1 | tail -1
          gh pr create --title "chore: bump @opencode/plugin pin to $SDK_VERSION" --body "Nightly SDK canary passed: published package imports cleanly against @opencode/plugin@$SDK_VERSION." || true
